<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="styles/style.css">
  <script defer src="scripts/script.js"></script>
</head>

<body>

  <main>

    <section>

      <article id="whereToGoArticle">

        <h1>Where should we go?</h1>

        <br />

        <form id="newActivityForm">
          <fieldset>
            <legend>Hm...</legend>

            <input type="text" id="nameInput" class="activityFormEl" placeholder="Name">
            <br />
            <textarea id="descriptionInput" class="activityFormEl" placeholder="Description" rows="4"></textarea>
            <br />
            <input type="text" id="locationInput" class="activityFormEl" placeholder="Location">

            <br />

            <select name="location" id="locationSelect" class="activityFormEl">
              <option value="New York">New York</option>
              <option value="Philadelphia">Philadelphia</option>
              <option value="Chicago">Chicago</option>
            </select>

            <br />

            <select name="weather" id="weatherSelect" class="activityFormEl">
              <option value="sunny">Sunny</option>
              <option value="snowy">Snowy</option>
              <option value="rainy">Rainy</option>
              <option value="cold">Cold</option>
            </select>

            <br />

            <input type="number" placeholder="Cost" min="0" id="costInput"  class="activityFormEl" required>

          </fieldset>

          <button id="newActivityFormSubmitBtn" type="submit">Add Activity</button>
        </form>

      </article>

      <article>

        <h1 id="totalCost"></h1>

      </article>

    </section>

    <aside>

      <ul id="adventureList"></ul>

    </aside>

  </main>

</body>

</html>
